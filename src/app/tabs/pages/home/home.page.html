<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Home</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Home</ion-title>
    </ion-toolbar>
  </ion-header>

  <section class="sections">
    <ion-button expand="block" size="large" routerLink="/tabs/events">
      <ion-icon slot="start" name="calendar" aria-hidden="true"></ion-icon>
      Events
    </ion-button>

    <ion-button expand="block" size="large" routerLink="/tabs/interpreters">
      <ion-icon slot="start" src="assets/icons/sign-language.svg" aria-hidden="true"></ion-icon>
      Interpreters
    </ion-button>

    <ion-button expand="block" size="large" routerLink="/tabs/videos">
      <ion-icon slot="start" name="videocam" aria-hidden="true"></ion-icon>
      Videos
    </ion-button>
  </section>
</ion-content>
